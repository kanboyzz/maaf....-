<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maafin Aku Ya? 🥺</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="card">
        <div class="emoji-container">
            <span class="emoji">🥺</span>
        </div>
        <h1>maafin aku ya, sayaang?</h1>
        <p id="message">kamuu pasti kecewa... sayaaang maafin akuuu, tapi nanti sore ternyata aku bisa ke sekolah kamuuuu 😿</p>
        
        <div class="btn-group">
            <button id="yesBtn" class="btn primary">maafin! ❤️</button>
            <button id="noBtn" class="btn secondary">nggak mau 😤</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
